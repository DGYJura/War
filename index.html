<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ППО України — Захист неба</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; background: radial-gradient(circle at 50% 0%, #101c33 0%, #05080f 70%);
    color:#e6edf7; font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:10px; user-select:none;
  }
  h1 { font-size:19px; margin:6px 0 10px; letter-spacing:2px; color:#ffd54a; text-shadow:0 0 18px #ffd54a55;}
  h1 span { color:#4da3ff; }
  #wrap { position:relative; max-width:100%; }
  canvas { display:block; background:#0d1524; border-radius:14px;
           box-shadow:0 0 40px #000a, 0 0 0 1px #ffffff14; cursor:crosshair;
           max-width:100%; height:auto; }
  #hud { position:absolute; top:10px; left:12px; right:12px; display:flex;
         gap:8px; font-size:13px; pointer-events:none; flex-wrap:wrap; }
  #hud span { background:#000a; padding:5px 11px; border-radius:9px;
              border:1px solid #ffffff1a; backdrop-filter:blur(4px); }
  #shop { display:flex; gap:9px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  .btn { background:#16203a; border:2px solid #2a3a5c; color:#cfe0ff;
         padding:8px 14px; border-radius:11px; cursor:pointer; font-size:13px;
         transition:.15s; text-align:left; min-width:130px; }
  .btn:hover { background:#1e2c4d; transform:translateY(-1px); }
  .btn.active { border-color:#ffd54a; box-shadow:0 0 14px #ffd54a55; }
  .btn small { display:block; opacity:.65; font-size:11px; margin-top:2px; }
  #over { position:absolute; inset:0; background:#000c; display:none;
          flex-direction:column; align-items:center; justify-content:center;
          border-radius:14px; gap:14px; backdrop-filter:blur(3px); }
  #over h2 { font-size:34px; margin:0; color:#ff4d6d; text-shadow:0 0 24px #ff4d6d66;}
  #over p { margin:0; font-size:17px; }
  #over button { background:#ffd54a; color:#0a0e1a; border:none; padding:12px 28px;
                 border-radius:11px; font-size:16px; font-weight:700; cursor:pointer; }
  #hint { margin-top:10px; font-size:12px; opacity:.5; }
</style>
</head>
<body>

<h1>ППО <span>УКРАЇНИ</span> — ЗАХИСТ НЕБА</h1>

<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="hud">
    <span id="hMoney">₴ 0</span>
    <span id="hLives">🏙 0</span>
    <span id="hWave">Хвиля 0</span>
    <span id="hScore">★ 0</span>
  </div>
  <div id="over">
    <h2>НЕБО ПРОРВАНО</h2>
    <p id="finalScore">Рахунок: 0</p>
    <button onclick="reset()">СПРОБУВАТИ ЩЕ</button>
  </div>
</div>

<div id="shop">
  <button class="btn active" data-type="gun">🔫 Кулемет ЗСУ<small>40₴ · далеко/швидко</small></button>
  <button class="btn" data-type="sam">🚀 ЗРК «Бук»<small>90₴ · середня дальність</small></button>
  <button class="btn" data-type="patriot">🛡 Patriot<small>170₴ · далеко, потужно</small></button>
</div>
<div id="hint">Клікай по небу, щоб розмістити ППО · Не став близько до землі</div>

<script>
/* ================== БАЗА ================== */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const GROUND = H - 70;

/* ================== ТИПИ ППО ================== */
const TYPES = {
  gun:     { key:'gun',     name:'Кулемет',  cost:40,  range:120, rate:5.0, dmg:1, color:'#ffd54a' },
  sam:     { key:'sam',     name:'Бук',      cost:90,  range:200, rate:1.3, dmg:3, color:'#4ade80' },
  patriot: { key:'patriot', name:'Patriot',  cost:170, range:320, rate:0.8, dmg:6, color:'#60a5fa' }
};

/* ================== ТИПИ ЦІЛЕЙ ================== */
const ETYPES = {
  drone:     { hp:1, speed:45,  reward:8,  color:'#ff6b6b', size:9,  lives:1, name:'Shahed' },
  cruise:    { hp:3, speed:95,  reward:16, color:'#ff9f43', size:10, lives:1, name:'Крилата' },
  ballistic: { hp:6, speed:180, reward:34, color:'#ff4d6d', size:11, lives:3, name:'Балістика' }
};

/* ================== СТАН ================== */
let money, lives, score, wave, gameOver;
let ppos, enemies, bullets, particles;
let spawnTimer, waveTimer, shake, msg, msgTimer, selected = 'gun';
let mouse = { x:-999, y:-999 };

/* декорації */
const stars = Array.from({length:90}, () => ({
  x: Math.random()*W, y: Math.random()*GROUND*0.9,
  r: Math.random()*1.4+0.3, a: Math.random()
}));
const buildings = [];
(function(){
  let x = -10;
  while (x < W + 10) {
    const w = 26 + Math.random()*44;
    buildings.push({ x, w, h: 22 + Math.random()*46, seed: Math.random() });
    x += w + 5;
  }
})();

/* ================== ЗВУК ================== */
let actx, lastBeep = 0;
function beep(freq, dur, vol, type='square') {
  try {
    const now = performance.now();
    if (now - lastBeep < 35) return;
    lastBeep = now;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e) {}
}

/* ================== СКИДАННЯ ================== */
function reset() {
  money = 130; lives = 20; score = 0; wave = 1; gameOver = false;
  ppos = []; enemies = []; bullets = []; particles = [];
  spawnTimer = 1.2; waveTimer = 0; shake = 0; msg = ''; msgTimer = 0;
  document.getElementById('over').style.display = 'none';
  updateHud();
}

/* ================== UI ================== */
function updateHud() {
  document.getElementById('hMoney').textContent = '₴ ' + money;
  document.getElementById('hLives').textContent = '🏙 ' + lives;
  document.getElementById('hWave').textContent = 'Хвиля ' + wave;
  document.getElementById('hScore').textContent = '★ ' + score;
  document.querySelectorAll('.btn[data-type]').forEach(b => {
    const t = TYPES[b.dataset.type];
    b.classList.toggle('active', b.dataset.type === selected);
    b.style.opacity = money < t.cost ? 0.45 : 1;
  });
}
document.querySelectorAll('.btn[data-type]').forEach(b => {
  b.addEventListener('click', () => { selected = b.dataset.type; updateHud(); });
});

function flash(text) { msg = text; msgTimer = 1.4; }

/* ================== РОЗМІЩЕННЯ ППО ================== */
function tryPlace(x, y) {
  const t = TYPES[selected];
  if (y < 60 || y > GROUND - 18) return flash('❌ Тут не можна ставити ППО');
  if (money < t.cost) return flash('❌ Недостатньо коштів');
  for (const p of ppos) if (Math.hypot(p.x - x, p.y - y) < 28) return flash('❌ Занадто близько');
  money -= t.cost;
  ppos.push({ x, y, range:t.range, rate:t.rate, dmg:t.dmg,
              color:t.color, cool:0, aim:-Math.PI/2 });
  beep(620, 0.09, 0.06, 'sine');
  updateHud();
}

cvs.addEventListener('mousemove', e => {
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cvs.addEventListener('mouseleave', () => { mouse.x = mouse.y = -999; });
cvs.addEventListener('click', e => {
  if (gameOver) return;
  const r = cvs.getBoundingClientRect();
  tryPlace((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
});
cvs.addEventListener('touchstart', e => {
  if (gameOver) return;
  e.preventDefault();
  const r = cvs.getBoundingClientRect();
  const t = e.touches[0];
  tryPlace((t.clientX - r.left) * (W / r.width), (t.clientY - r.top) * (H / r.height));
}, { passive:false });

/* ================== СПАВН ================== */
function spawnEnemy() {
  const r = Math.random();
  let type;
  if (wave < 3)       type = r < 0.85 ? 'drone' : 'cruise';
  else if (wave < 6)  type = r < 0.55 ? 'drone' : r < 0.88 ? 'cruise' : 'ballistic';
  else                type = r < 0.35 ? 'drone' : r < 0.72 ? 'cruise' : 'ballistic';

  const d = ETYPES[type];
  const sx = 40 + Math.random() * (W - 80);
  const tx = 40 + Math.random() * (W - 80);
  const dx = tx - sx, dy = GROUND - (-25);
  const len = Math.hypot(dx, dy);

  enemies.push({
    x: sx, y: -25, dirx: dx / len, diry: dy / len,
    hp: d.hp, maxHp: d.hp, size: d.size, color: d.color,
    speed: d.speed * (1 + wave * 0.03),
    reward: d.reward, lives: d.lives, dead: false
  });
}

/* ================== ЧАСТИНКИ ================== */
function explosion(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 30 + Math.random() * 160;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 0.35 + Math.random()*0.5, max: 0.85,
      color, size: 1 + Math.random()*2.6
    });
  }
}

/* ================== ПОШКОДЖЕННЯ ================== */
function hitEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  explosion(e.x, e.y, e.color, 4);
  if (e.hp <= 0) {
    e.dead = true;
    money += e.reward;
    score += e.reward;
    explosion(e.x, e.y, '#ffd54a', 16);
    beep(880, 0.07, 0.05, 'triangle');
    updateHud();
  }
}

/* ================== ОНОВЛЕННЯ ================== */
function update(dt) {
  if (gameOver) return;

  waveTimer += dt;
  if (waveTimer > 25) { waveTimer = 0; wave++; updateHud(); }

  /* спавн */
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    const base = Math.max(0.32, 1.5 - wave * 0.085);
    spawnTimer = base * (0.7 + Math.random() * 0.65);
  }

  /* вороги */
  for (const e of enemies) {
    if (e.dead) continue;
    e.x += e.dirx * e.speed * dt;
    e.y += e.diry * e.speed * dt;
    if (e.y >= GROUND - 6) {
      e.dead = true;
      lives -= e.lives;
      explosion(e.x, GROUND - 12, '#ff4d6d', 22);
      shake = 14;
      beep(120, 0.25, 0.12, 'sawtooth');
      if (lives <= 0) { lives = 0; endGame(); }
      updateHud();
    }
  }

  /* ППО стріляє */
  for (const p of ppos) {
    p.cool -= dt;
    if (p.cool > 0) continue;
    let best = null, bestD = Infinity;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = Math.hypot(e.x - p.x, e.y - p.y);
      if (d < p.range && d < bestD) { bestD = d; best = e; }
    }
    if (best) {
      p.cool = 1 / p.rate;
      p.aim = Math.atan2(best.y - p.y, best.x - p.x);
      bullets.push({ x:p.x, y:p.y, target:best, speed:560,
                     dmg:p.dmg, color:p.color, dead:false });
      if (p.rate < 2) beep(1100, 0.05, 0.035, 'square');
    } else {
      p.aim += dt * 0.6; // холостий оберт
    }
  }

  /* снаряди */
  for (const b of bullets) {
    if (b.dead) continue;
    if (!b.target || b.target.dead) { b.dead = true; continue; }
    const t = b.target;
    const dx = t.x - b.x, dy = t.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    const step = b.speed * dt;
    if (d <= step + 8) { hitEnemy(t, b.dmg); b.dead = true; }
    else { b.x += dx / d * step; b.y += dy / d * step; }
  }

  /* частинки */
  for (const pt of particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt;
  }

  enemies   = enemies.filter(e => !e.dead);
  bullets   = bullets.filter(b => !b.dead);
  particles = particles.filter(p => p.life > 0);

  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (msgTimer > 0) msgTimer -= dt;
}

function endGame() {
  gameOver = true;
  document.getElementById('finalScore').textContent = 'Рахунок: ' + score + ' · Хвиля ' + wave;
  document.getElementById('over').style.display = 'flex';
}

/* ================== МАЛЮВАННЯ ================== */
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  /* небо */
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#060a14');
  g.addColorStop(0.55, '#0e1a33');
  g.addColorStop(1, '#17325c');
  ctx.fillStyle = g;
  ctx.fillRect(-30, -30, W + 60, GROUND + 30);

  /* зорі */
  const t = performance.now() / 1000;
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(t * 0.8 + s.a * 9));
    ctx.fillStyle = '#cfe0ff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  /* місто */
  ctx.fillStyle = '#04070d';
  ctx.fillRect(-30, GROUND, W + 60, H - GROUND + 30);
  for (const b of buildings) {
    ctx.fillStyle = '#0a1322';
    ctx.fillRect(b.x, GROUND, b.w, b.h);
    ctx.fillStyle = 'rgba(120,180,255,0.16)';
    for (let wy = GROUND + 6; wy < GROUND + b.h - 5; wy += 11) {
      for (let wx = b.x + 5; wx < b.x + b.w - 5; wx += 10) {
        if ((wx * 7 + wy * 3 + b.seed * 100) % 5 < 2) ctx.fillRect(wx, wy, 4, 5);
      }
    }
  }
  /* лінія фронту */
  ctx.strokeStyle = 'rgba(255,213,74,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

  /* радіуси ППО */
  for (const p of ppos) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.range, 0, Math.PI * 2);
    ctx.fillStyle = p.color + '08';
    ctx.fill();
    ctx.strokeStyle = p.color + '22';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ППО */
  for (const p of ppos) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#1b2740'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.stroke(); ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(p.aim) * 15, p.y + Math.sin(p.aim) * 15);
    ctx.strokeStyle = p.color; ctx.lineWidth = 3.5; ctx.stroke();
  }

  /* вороги */
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(Math.atan2(e.diry, e.dirx) + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -e.size);
    ctx.lineTo(e.size * 0.72, e.size * 0.8);
    ctx.lineTo(0, e.size * 0.4);
    ctx.lineTo(-e.size * 0.72, e.size * 0.8);
    ctx.closePath();
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color; ctx.shadowBlur = 14;
    ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;

    if (e.hp < e.maxHp) {
      const w = 22;
      ctx.fillStyle = '#000a';
      ctx.fillRect(e.x - w/2, e.y - e.size - 10, w, 3.5);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - w/2, e.y - e.size - 10, w * (e.hp / e.maxHp), 3.5);
    }
  }

  /* снаряди */
  for (const b of bullets) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - 6, b.y + 6);
    ctx.strokeStyle = b.color; ctx.lineWidth = 2.5;
    ctx.shadowColor = b.color; ctx.shadowBlur = 8;
    ctx.stroke(); ctx.shadowBlur = 0;
  }

  /* частинки */
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  /* прев'ю розміщення */
  if (!gameOver && mouse.x > -100) {
    const ty = TYPES[selected];
    const ok = mouse.y >= 60 && mouse.y <= GROUND - 18 && money >= ty.cost;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, ty.range, 0, Math.PI * 2);
    ctx.strokeStyle = ok ? ty.color + '77' : '#ff4d6d66';
    ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = ok ? ty.color + '55' : '#ff4d6d44';
    ctx.fill();
  }

  ctx.restore();

  /* повідомлення */
  if (msgTimer > 0) {
    ctx.globalAlpha = Math.min(1, msgTimer * 2);
    ctx.font = 'bold 17px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff9f43';
    ctx.fillText(msg, W / 2, H - 22);
    ctx.globalAlpha = 1;
  }
}

/* ================== ЦИКЛ ================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
